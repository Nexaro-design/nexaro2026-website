<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About Nexaro Global | IT Delivery &amp; Digital Transformation Advisory</title>
<meta name="description" content="About Nexaro Global Pty Ltd — founder background, mission, and our Acknowledgement of Country. Based in Strathfield, NSW, Australia.">
</head>
<body>
<div id="about-root"></div>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

#about-root{
  --navy:#101B33; --navy-deep:#0A1226; --gold:#B8862E; --gold-light:#D4A94F; --ivory:#FAF8F3; --grey:#8A96A8; --line:#e6e1d6; --ink:#141821;
  font-family:'Inter', sans-serif; color: var(--ink); background: var(--ivory); border-radius:12px; overflow:hidden;
}
#about-root *{ box-sizing:border-box; }

.ab-nav{ display:flex; align-items:center; justify-content:space-between; padding:22px 40px; background: var(--ivory); border-bottom:1px solid var(--line); }
.ab-brand{ display:flex; align-items:center; gap:12px; text-decoration:none; }
.ab-mark{ width:44px; height:44px; filter: drop-shadow(0 3px 4px rgba(16,27,51,0.35)); }
.ab-brand-text{ font-family:'Cormorant Garamond', serif; font-weight:700; font-size:18px; color: var(--navy); line-height:1.1; }
.ab-brand-text span{ display:block; font-family:'JetBrains Mono', monospace; font-size:9px; letter-spacing:0.18em; color: var(--gold); font-weight:500; }
.ab-back{ font-size:13px; font-weight:600; color: var(--navy); text-decoration:none; }
.ab-back:hover{ color: var(--gold); }

.ab-hero{ background: var(--navy); color: var(--ivory); padding:70px 40px 60px; text-align:center; }
.ab-eyebrow{ font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:0.24em; text-transform:uppercase; color: var(--gold-light); margin-bottom:16px; }
.ab-hero h1{ font-family:'Cormorant Garamond', serif; font-weight:700; font-size:40px; margin:0; }

.ab-section{ padding:56px 40px; max-width:820px; margin:0 auto; }
.ab-section h2{ font-family:'Cormorant Garamond', serif; font-size:26px; color: var(--navy); margin:0 0 16px; }
.ab-section p{ font-size:14.5px; line-height:1.8; color:#3a3d45; margin:0 0 16px; }
.ab-stats{ display:flex; gap:36px; margin-top:22px; flex-wrap:wrap; }
.ab-stat b{ display:block; font-family:'Cormorant Garamond', serif; font-size:30px; color: var(--navy); }
.ab-stat span{ font-family:'JetBrains Mono', monospace; font-size:10px; letter-spacing:0.08em; color: var(--gold); text-transform:uppercase; }

.ab-acknowledgement{ background:#fff; border:1px solid var(--line); border-radius:10px; padding:40px; text-align:center; margin:0 40px 60px; }
.ab-flags{ display:flex; justify-content:center; gap:10px; margin-bottom:20px; }
.ab-flags svg{ width:44px; height:28px; border-radius:2px; }
.ab-acknowledgement p{ font-size:15px; line-height:1.85; color:#2a2d33; max-width:640px; margin:0 auto; }
.ab-acknowledgement .source{ font-size:11px; color: var(--grey); margin-top:18px; font-style:italic; }

footer.ab-foot{ background: var(--navy-deep); color:#8A96A8; text-align:center; padding:22px; font-size:11.5px; font-family:'JetBrains Mono', monospace; }
@media (max-width: 720px){
  .ab-nav > div{ display:none !important; }
  .ab-section > div[style*="grid-template-columns"]{ grid-template-columns: 1fr !important; }
}
</style>

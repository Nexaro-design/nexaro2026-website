<div id="log-root"></div>
<style>
#log-root{
  --navy:#13293D; --gold:#B8862E; --ivory:#FAF8F3; --grey:#6D7D88; --line:#e6e1d6; --green:#1F5C4B; --amber:#a1691f;
  font-family: 'Inter', -apple-system, sans-serif;
  background: var(--ivory); border-radius: 12px; padding: 32px 28px; color:#222;
}
#log-root h1{ font-size:24px; color: var(--navy); margin:0 0 4px; }
#log-root .sub{ color: var(--grey); font-size:13px; margin-bottom:28px; }
.version-card{ background:#fff; border:1px solid var(--line); border-radius:8px; padding:20px 22px; margin-bottom:16px; position:relative; }
.version-card.current{ border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold); }
.v-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; flex-wrap:wrap; gap:8px; }
.v-tag{ font-family:'JetBrains Mono', monospace; font-weight:700; font-size:15px; color: var(--navy); }
.v-badge{ font-size:10.5px; font-family:'JetBrains Mono', monospace; letter-spacing:0.05em; padding:3px 9px; border-radius:100px; background: rgba(31,92,75,0.12); color: var(--green); }
.v-badge.rolled-back{ background: rgba(161,105,31,0.12); color: var(--amber); }
.v-date{ font-family:'JetBrains Mono', monospace; font-size:11.5px; color: var(--grey); }
.v-changes{ margin:8px 0 10px; padding-left:18px; font-size:13.5px; line-height:1.7; color:#3a3d45; }
.v-file{ font-size:11px; font-family:'JetBrains Mono', monospace; color: var(--grey); background:#f4f2ec; padding:4px 8px; border-radius:4px; display:inline-block; }
.rollback-note{ font-size:11.5px; color: var(--amber); font-style:italic; margin-top:8px; }
.legend{ margin-top:24px; padding-top:16px; border-top:1px solid var(--line); font-size:11.5px; color: var(--grey); line-height:1.7; }
</style>

<body>
<div id="nexaro-root"></div>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

#nexaro-root{
  --navy:#101B33;
  --navy-deep:#0A1226;
  --steel:#8A96A8;
  --steel-light:#C6CCD6;
  --gold:#B8862E;
  --gold-light:#D4A94F;
  --ivory:#FAF8F3;
  --ink:#141821;
  --font-display:'Space Grotesk', sans-serif;
  --font-body:'Inter', sans-serif;
  --font-mono:'JetBrains Mono', monospace;
  font-family: var(--font-body);
  color: var(--ink);
  background: var(--ivory);
  border-radius: 12px;
  overflow: hidden;
}
#nexaro-root *{ box-sizing: border-box; }

/* ---- nav ---- */
.nx-nav{ display:flex; align-items:center; justify-content:space-between; padding: 22px 40px; background: var(--ivory); border-bottom: 1px solid #e6e1d6; position: sticky; top:0; z-index: 10; transition: background 0.3s ease, box-shadow 0.3s ease, backdrop-filter 0.3s ease; }
.nx-nav.scrolled{ background: rgba(250,248,243,0.72); backdrop-filter: blur(14px) saturate(160%); -webkit-backdrop-filter: blur(14px) saturate(160%); box-shadow: 0 4px 20px rgba(16,27,51,0.08); }
.nx-brand{ display:flex; align-items:center; gap:12px; }
.nx-mark{ width:52px; height:52px; filter: drop-shadow(0 3px 4px rgba(16,27,51,0.45)) drop-shadow(0 1px 1px rgba(255,255,255,0.15)); transform: perspective(200px) rotateY(-6deg); transition: transform 0.25s ease; }
.nx-brand:hover .nx-mark{ transform: perspective(200px) rotateY(0deg) scale(1.04); }
.nx-brand-text{ font-family: var(--font-display); font-weight:700; font-size:18px; letter-spacing:0.02em; color: var(--navy); line-height:1.1; }
.nx-brand-text span{ display:block; font-family: var(--font-mono); font-size:9px; letter-spacing:0.18em; color: var(--gold); font-weight:500; }
.nx-links{ display:flex; gap:32px; list-style:none; margin:0; padding:0; }
.nx-links button{ background:none; border:none; font-family: var(--font-body); font-size:13.5px; font-weight:600; color: var(--navy); cursor:pointer; }
.nx-cta{ background: var(--navy); color:#fff; border:none; padding:11px 22px; border-radius:2px; font-size:13px; font-weight:600; cursor:pointer; letter-spacing:0.02em; }

/* ---- hero ---- */
.nx-hero{ position:relative; background: var(--navy); color: var(--ivory); padding: 100px 40px 90px; overflow:hidden; }
.nx-hero-mesh{ position:absolute; inset:0; opacity:0.5; }
.nx-hero-inner{ position:relative; max-width: 760px; margin:0 auto; text-align:center; }
.nx-eyebrow{ font-family: var(--font-mono); font-size:11px; letter-spacing:0.28em; text-transform:uppercase; color: var(--gold-light); margin-bottom:22px; }
.nx-hero h1{ font-family: var(--font-display); font-weight:700; font-size:50px; line-height:1.12; margin:0 0 22px; letter-spacing:-0.01em; }
.nx-hero h1 em{ font-style:normal; color: var(--gold-light); }
.nx-hero p{ font-size:16px; line-height:1.65; color: var(--steel-light); max-width:560px; margin: 0 auto 34px; }
.nx-hero-cta{ display:flex; gap:14px; justify-content:center; }
.btn-gold{ background: var(--gold); color: var(--navy-deep); border:none; padding:14px 28px; border-radius:2px; font-weight:700; font-size:13.5px; letter-spacing:0.02em; cursor:pointer; transition: box-shadow 0.25s ease, transform 0.25s ease; }
.btn-gold:hover{ box-shadow: 0 0 22px rgba(212,169,79,0.55), 0 6px 18px rgba(16,27,51,0.25); transform: translateY(-2px); }
.btn-ghost{ background:transparent; border:1px solid rgba(255,255,255,0.3); color: var(--ivory); padding:14px 28px; border-radius:2px; font-weight:600; font-size:13.5px; cursor:pointer; }

/* ---- section shell ---- */
.nx-section{ padding: 80px 40px; max-width: 1080px; margin: 0 auto; }
.nx-head{ margin-bottom: 44px; max-width: 620px; }
.nx-head .eyebrow{ font-family: var(--font-mono); font-size:11px; letter-spacing:0.22em; text-transform:uppercase; color: var(--gold); font-weight:600; margin-bottom:12px; }
.nx-head h2{ font-family: var(--font-display); font-size:32px; font-weight:700; color: var(--navy); margin:0; letter-spacing:-0.01em; }
.nx-head p{ color:#5b5f6b; font-size:14.5px; line-height:1.6; margin-top:12px; }

/* ---- services ---- */
.svc-grid{ display:grid; grid-template-columns: repeat(2,1fr); gap:2px; background:#e6e1d6; border:1px solid #e6e1d6; }
.svc-card{ background: rgba(250,248,243,0.6); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); padding: 30px 28px; transition: transform 0.3s ease, box-shadow 0.3s ease, background 0.3s ease; }
.svc-card:hover{ transform: translateY(-4px); box-shadow: 0 14px 34px rgba(16,27,51,0.12); background: rgba(255,255,255,0.85); }
.svc-num{ font-family: var(--font-mono); font-size:11px; color: var(--gold); letter-spacing:0.1em; margin-bottom:14px; }
.svc-card h3{ font-family: var(--font-display); font-size:19px; font-weight:600; color: var(--navy); margin:0 0 10px; }
.svc-card p{ font-size:13.5px; line-height:1.65; color:#5b5f6b; margin:0; }

/* ---- about ---- */
.about-wrap{ display:grid; grid-template-columns: 1fr 1.4fr; gap:48px; align-items:start; }
.about-mark{ width:100%; aspect-ratio:1; display:flex; align-items:center; justify-content:center; background: transparent; }
.about-copy p{ font-size:14.5px; line-height:1.75; color:#3a3d45; margin-bottom:16px; }
.about-stats{ display:flex; gap:32px; margin-top:24px; }
.stat b{ display:block; font-family: var(--font-display); font-size:26px; color: var(--navy); }
.stat span{ font-family: var(--font-mono); font-size:10px; letter-spacing:0.08em; color: var(--gold); text-transform:uppercase; }

/* ---- approach ---- */
.approach-list{ border-top:1px solid #e6e1d6; }
.approach-item{ display:grid; grid-template-columns: 50px 1fr; gap:20px; padding: 24px 0; border-bottom:1px solid #e6e1d6; }
.approach-item .step-num-col{ position: relative; display:flex; flex-direction:column; align-items:center; }
.approach-item .step-num-col .num-circle{
  width:34px; height:34px; border-radius:50%; background: var(--navy); color: var(--gold-light);
  display:flex; align-items:center; justify-content:center; font-family: var(--font-mono); font-size:12px; font-weight:700; z-index:1;
}
.approach-item .step-num-col .connector{
  position:absolute; top:34px; bottom:-24px; width:2px; background: repeating-linear-gradient(to bottom, var(--gold) 0 4px, transparent 4px 8px);
}
.approach-item:last-child .step-num-col .connector{ display:none; }
.approach-item h4{ font-family: var(--font-display); font-size:17px; font-weight:600; color: var(--navy); margin:0 0 6px; }
.approach-item p{ font-size:13.5px; color:#5b5f6b; margin:0; line-height:1.6; max-width:520px; }

/* ---- mid-page CTA banner ---- */
.mid-cta{ background: var(--gold); padding: 34px 40px; text-align:center; }
.mid-cta p{ font-family: var(--font-display); font-size:19px; color: var(--navy-deep); margin:0 0 14px; font-weight:600; }
.mid-cta button{ background: var(--navy); color:#fff; border:none; padding:12px 26px; border-radius:2px; font-weight:700; font-size:13px; letter-spacing:0.02em; cursor:pointer; }

/* ---- contact ---- */
/* ---- clients ---- */
.client-grid{ display:grid; grid-template-columns: repeat(2,1fr); gap:16px; }
.client-card{ background: rgba(250,248,243,0.65); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border:1px solid #e6e1d6; padding: 26px 26px 22px; display:flex; flex-direction:column; gap:10px; transition: transform 0.3s ease, box-shadow 0.3s ease; }
.client-card:hover{ transform: translateY(-3px); box-shadow: 0 12px 28px rgba(16,27,51,0.10); }
.client-top{ display:flex; align-items:center; justify-content:space-between; }
.client-name{ font-family: var(--font-display); font-size:19px; font-weight:700; color: var(--navy); }
.client-badge{ font-family: var(--font-mono); font-size:9.5px; letter-spacing:0.08em; text-transform:uppercase; background: rgba(184,134,46,0.12); color: var(--gold); padding:4px 9px; border-radius:100px; white-space:nowrap; }
.client-industry{ font-family: var(--font-mono); font-size:11px; color: var(--steel); letter-spacing:0.04em; }
.client-desc{ font-size:13px; color:#5b5f6b; line-height:1.6; margin:0; }
.client-note{ font-size:11.5px; color: var(--steel); font-style:italic; margin-top:6px; }

/* ---- stats bar ---- */
/* ---- scroll-reveal (Phase 1 premium motion, vanilla JS + IntersectionObserver) ---- */
[data-reveal]{ opacity:0; transform: translateY(18px); transition: opacity 0.7s ease, transform 0.7s ease; }
[data-reveal].revealed{ opacity:1; transform: translateY(0); }

.stats-bar{ background: var(--navy); padding: 40px 40px; }
.stats-inner{ max-width:1080px; margin:0 auto; display:grid; grid-template-columns: repeat(4,1fr); gap:20px; text-align:center; }
.stat-box b{ display:block; font-family: var(--font-display); font-size:34px; color: var(--gold-light); }
.stat-box span{ font-family: var(--font-mono); font-size:10.5px; letter-spacing:0.1em; text-transform:uppercase; color: var(--steel-light); }

/* ---- why choose us ---- */
.why-grid{ display:grid; grid-template-columns: repeat(3,1fr); gap:24px; }
.why-tile{ padding: 4px 0; }
.why-tile .why-icon{ width:38px; height:38px; border-radius:8px; background: rgba(184,134,46,0.12); display:flex; align-items:center; justify-content:center; margin-bottom:14px; font-size:17px; color: var(--gold); }
.why-tile h4{ font-family: var(--font-display); font-size:16.5px; font-weight:600; color: var(--navy); margin:0 0 6px; }
.why-tile p{ font-size:13px; color:#5b5f6b; line-height:1.6; margin:0; }

.nx-contact{ background: var(--navy); color: var(--ivory); padding: 80px 40px; }
.contact-inner{ max-width:1080px; margin:0 auto; display:grid; grid-template-columns:1fr 1fr; gap:50px; }
.contact-inner h2{ font-family: var(--font-display); font-size:30px; margin:0 0 16px; }
.contact-inner > div:first-child p{ color: var(--steel-light); font-size:14.5px; line-height:1.7; max-width:420px; }
.c-row{ display:flex; align-items:center; gap:14px; padding: 14px 0; border-bottom:1px solid rgba(255,255,255,0.12); font-size:14px; }
.c-row .ic{ width:32px; height:32px; border-radius:8px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.c-row .ic svg{ width:100%; height:100%; display:block; }
.c-row a{ color: var(--ivory); text-decoration:none; }
.c-row a:hover{ color: var(--gold-light); }

/* ---- project submission form (mailto-based, zero-data architecture preserved) ---- */
.form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:6px; }
.form-field{ display:flex; flex-direction:column; gap:6px; }
.form-field label{ font-family: var(--font-mono); font-size:10.5px; letter-spacing:0.06em; text-transform:uppercase; color: var(--gold-light); }
.form-field input{ background: rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.18); border-radius:6px; padding:11px 12px; color:#fff; font-family: var(--font-body); font-size:13.5px; }
.form-field input::placeholder{ color: rgba(255,255,255,0.35); }
.form-field input:focus{ outline:none; border-color: var(--gold); background: rgba(255,255,255,0.1); }
.form-submit{ margin-top:18px; background: var(--gold); color: var(--navy-deep); border:none; padding:13px 26px; border-radius:4px; font-weight:700; font-size:13px; cursor:pointer; transition: box-shadow 0.25s ease, transform 0.25s ease; }
.form-submit:hover{ box-shadow: 0 0 22px rgba(212,169,79,0.5); transform: translateY(-2px); }
.form-note{ font-size:11px; color: var(--steel-light); margin-top:10px; line-height:1.6; }

footer.nx-foot{ background: var(--navy-deep); color: var(--steel); text-align:center; padding: 22px; font-size:11.5px; font-family: var(--font-mono); letter-spacing:0.02em; }

/* ---- chatbot widget ---- */
.nx-chat-bubble{
  position:fixed; bottom:24px; right:24px; width:60px; height:60px; border-radius:50%;
  background: var(--navy); border:2px solid var(--gold); display:flex; align-items:center; justify-content:center;
  cursor:pointer; z-index:999; box-shadow:0 6px 18px rgba(16,27,51,0.35); transition: transform 0.2s;
}
.nx-chat-bubble:hover{ transform: scale(1.06); }
.nx-chat-bubble svg{ width:26px; height:26px; }
.nx-chat-panel{
  position:fixed; bottom:96px; right:24px; width:340px; max-width:calc(100vw - 32px); max-height:520px;
  background:#fff; border:1px solid var(--line); border-radius:12px; box-shadow:0 12px 40px rgba(16,27,51,0.25);
  display:none; flex-direction:column; overflow:hidden; z-index:999; font-family: var(--font-body);
}
.nx-chat-panel.open{ display:flex; }
.nx-chat-head{ background: var(--navy); color:#fff; padding:14px 16px; display:flex; align-items:center; justify-content:space-between; }
.nx-chat-head .title{ font-family: var(--font-display); font-size:14.5px; font-weight:700; }
.nx-chat-head .sub{ font-family: var(--font-mono); font-size:10px; color: var(--gold-light); margin-top:2px; }
.nx-chat-close{ background:none; border:none; color:#fff; font-size:18px; cursor:pointer; line-height:1; padding:2px 4px; }
.nx-chat-body{ flex:1; overflow-y:auto; padding:14px 14px 8px; background: var(--ivory); display:flex; flex-direction:column; gap:10px; }
.nx-msg{ max-width:85%; padding:9px 12px; border-radius:10px; font-size:13px; line-height:1.55; }
.nx-msg.bot{ background:#fff; border:1px solid var(--line); color:#2a2d33; align-self:flex-start; border-bottom-left-radius:2px; }
.nx-msg.user{ background: var(--navy); color:#fff; align-self:flex-end; border-bottom-right-radius:2px; }
.nx-chat-options{ padding:8px 14px 14px; background: var(--ivory); display:flex; flex-direction:column; gap:6px; border-top:1px solid var(--line); }
.nx-chat-opt{
  background:#fff; border:1.5px solid var(--gold); color: var(--navy); border-radius:100px; padding:8px 14px;
  font-size:12.5px; font-weight:600; cursor:pointer; text-align:left; transition: background 0.15s;
}
.nx-chat-opt:hover{ background: var(--gold); color:#fff; }
.nx-chat-input-row{ display:flex; gap:8px; padding:10px 14px 14px; background:#fff; border-top:1px solid var(--line); }
.nx-chat-input-row input{ flex:1; border:1px solid var(--line); border-radius:8px; padding:9px 11px; font-size:12.5px; }
.nx-chat-input-row button{ background: var(--navy); color:#fff; border:none; padding:0 16px; border-radius:8px; font-weight:700; font-size:12.5px; cursor:pointer; }
.nx-chat-input-row button:disabled{ background:#9aa5ae; cursor:default; }
.nx-msg.typing{ font-style:italic; color: var(--grey); }
@media (max-width: 420px){
  .nx-chat-panel{ right:16px; left:16px; width:auto; bottom:88px; }
  .nx-chat-bubble{ right:16px; }
}


@media (max-width: 720px){
  .nx-links{ display:none; }
  .nx-hero h1{ font-size:34px; }
  .svc-grid{ grid-template-columns: 1fr; }
  .about-wrap{ grid-template-columns: 1fr; }
  .client-grid{ grid-template-columns: 1fr; }
  .stats-inner{ grid-template-columns: repeat(2,1fr); }
  .why-grid{ grid-template-columns: 1fr; }
  .contact-inner{ grid-template-columns: 1fr; }
}
</style>
<script>
(function(){
  const root = document.getElementById('nexaro-root');

  function markSVG(size){
    return `<svg width="${size}" height="${size}" viewBox="0 0 100 100">
      <polygon points="50,5 90,30 90,70 50,95 10,70 10,30" fill="none" stroke="#B8862E" stroke-width="2"/>
      <polygon points="50,5 90,30 50,50 10,30" fill="#C6CCD6" opacity="0.9"/>
      <polygon points="50,50 90,30 90,70 50,95" fill="#8A96A8" opacity="0.9"/>
      <polygon points="50,50 10,30 10,70 50,95" fill="#101B33" opacity="0.85"/>
      <line x1="50" y1="5" x2="50" y2="50" stroke="#0A1226" stroke-width="1"/>
      <line x1="10" y1="30" x2="50" y2="50" stroke="#0A1226" stroke-width="1"/>
      <line x1="90" y1="30" x2="50" y2="50" stroke="#0A1226" stroke-width="1"/>
    </svg>`;
  }

  function meshSVG(){
    const pts = [[60,40],[180,20],[300,60],[420,15],[540,50],[660,25],
                 [90,140],[230,110],[360,150],[490,120],[610,155],
                 [50,240],[190,220],[330,255],[460,215],[600,245],
                 [110,340],[260,320],[400,350],[540,315]];
    let lines='';
    for(let i=0;i<pts.length;i++){
      for(let j=i+1;j<pts.length;j++){
        const d = Math.hypot(pts[i][0]-pts[j][0], pts[i][1]-pts[j][1]);
        if(d < 150 && Math.random()>0.55){
          lines += `<line x1="${pts[i][0]}" y1="${pts[i][1]}" x2="${pts[j][0]}" y2="${pts[j][1]}" stroke="#B8862E" stroke-width="0.6" opacity="0.35"/>`;
        }
      }
    }
    let dots = pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="2.2" fill="#D4A94F" opacity="0.6"/>`).join('');
    return `<svg viewBox="0 0 680 380" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">${lines}${dots}</svg>`;
  }

  function badgeShell(id, bg, inner){
    return `<svg viewBox="0 0 32 32">
      <defs>
        <linearGradient id="g${id}" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="${bg[0]}"/><stop offset="100%" stop-color="${bg[1]}"/>
        </linearGradient>
        <filter id="s${id}" x="-30%" y="-30%" width="160%" height="160%">
          <feDropShadow dx="0" dy="1.2" stdDeviation="1" flood-color="#000" flood-opacity="0.35"/>
        </filter>
      </defs>
      <rect x="1" y="1" width="30" height="30" rx="7" fill="url(#g${id})" filter="url(#s${id})"/>
      <rect x="1" y="1" width="30" height="14" rx="7" fill="#fff" opacity="0.12"/>
      ${inner}
    </svg>`;
  }

  function linkedinIcon(){
    return badgeShell('li', ['#0A66C2','#004182'],
      `<text x="16" y="22" font-family="Arial,sans-serif" font-weight="700" font-size="15" fill="#fff" text-anchor="middle">in</text>`);
  }
  function phoneIcon(){
    return badgeShell('ph', ['#2FA36A','#1B6E48'],
      `<path d="M10 9c0-1 1-2 2-2l2 1 1 3-1.5 1.5c.8 2 2 3.7 4 4.5L19 15l3 1c1 0 2 1 2 2 0 2-1.5 4-3.5 4C13.5 22 10 17.5 10 12.5c0-1 .2-2.2 0-3.5z" fill="#fff"/>`);
  }
  function emailIcon(){
    return badgeShell('em', ['#B8862E','#8C6A22'],
      `<rect x="7" y="10" width="18" height="13" rx="2" fill="#fff"/><path d="M7 11l9 6 9-6" stroke="#8C6A22" stroke-width="1.6" fill="none"/>`);
  }
  function pinIcon(){
    return badgeShell('pn', ['#C0392B','#8E241A'],
      `<path d="M16 8c-3 0-5.5 2.3-5.5 5.4 0 4 5.5 10.6 5.5 10.6s5.5-6.6 5.5-10.6C21.5 10.3 19 8 16 8z" fill="#fff"/><circle cx="16" cy="13.2" r="2.1" fill="#8E241A"/>`);
  }


  root.innerHTML = `

  // CSP-safe event delegation: replaces all inline onclick="" handlers.
  // Any element with data-scroll-target="<section-id>" smooth-scrolls to that section on click.
  root.addEventListener('click', function(e){
    const trigger = e.target.closest('[data-scroll-target]');
    if(!trigger) return;
    const targetEl = document.getElementById(trigger.getAttribute('data-scroll-target'));
    if(targetEl) targetEl.scrollIntoView({behavior:'smooth'});
  });

  // ============================================================
  // AI-POWERED CHATBOT WIDGET (Option B)
  // Frontend calls our OWN same-origin serverless endpoint ("/api/chat"),
  // never the Anthropic API directly. The real API key lives only in
  // Vercel's environment variables, inside /api/chat.js -- never here,
  // never in the browser. This keeps the site's CSP clean too: fetch()
  // stays same-origin ('self'), so no CSP change is needed for this.
  // ============================================================
  const chatMessages = [];
  const CHAT_SUGGESTIONS = [
    "What services do you offer?",
    "Tell me about your experience",
    "How does the engagement process work?"
  ];

  function chatAddMsg(text, sender){
    chatMessages.push({ sender, text });
    chatRenderTranscript();
  }

  function chatRenderTranscript(){
    const bodyEl = document.getElementById('nx-chat-body');
    if(!bodyEl) return;
    bodyEl.innerHTML = chatMessages.map(m =>
      `<div class="nx-msg ${m.sender}">${m.text}</div>`
    ).join('');
    bodyEl.scrollTop = bodyEl.scrollHeight;
  }

  function chatRenderSuggestions(){
    const wrap = document.getElementById('nx-chat-options');
    if(!wrap) return;
    wrap.innerHTML = CHAT_SUGGESTIONS.map((q, i) =>
      `<button class="nx-chat-opt" data-chat-suggest="${i}">${q}</button>`
    ).join('');
  }

  async function chatAskAI(question){
    const input = document.getElementById('nx-chat-input');
    const sendBtn = document.getElementById('nx-chat-send');
    const optsWrap = document.getElementById('nx-chat-options');
    optsWrap.innerHTML = '';

    chatAddMsg(question, 'user');
    if(input) input.value = '';
    if(sendBtn) sendBtn.disabled = true;
    chatMessages.push({ sender: 'bot typing', text: 'Thinking...' });
    chatRenderTranscript();

    try{
      const response = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: question })
      });
      const data = await response.json();
      chatMessages.pop(); // remove "Thinking..."
      if(!response.ok){
        chatAddMsg(data.error || "Sorry, something went wrong. Please try again.", 'bot');
      } else {
        chatAddMsg(data.reply, 'bot');
      }
    }catch(err){
      chatMessages.pop();
      chatAddMsg("Sorry, I couldn't reach the assistant just now. Please try again or use the contact details below.", 'bot');
      console.error(err);
    }finally{
      if(sendBtn) sendBtn.disabled = false;
    }
  }

  function mountChatWidget(){
    const wrap = document.createElement('div');
    wrap.innerHTML = `
      <div class="nx-chat-bubble" id="nx-chat-bubble" title="Chat with Nexaro Global">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 5h16a1 1 0 011 1v10a1 1 0 01-1 1H9l-4 4v-4H4a1 1 0 01-1-1V6a1 1 0 011-1z" stroke="#D4A94F" stroke-width="1.6" fill="none"/>
        </svg>
      </div>
      <div class="nx-chat-panel" id="nx-chat-panel">
        <div class="nx-chat-head">
          <div><div class="title">Nexaro Global Assistant</div><div class="sub">AI-powered \u2014 ask anything</div></div>
          <button class="nx-chat-close" id="nx-chat-close" aria-label="Close chat">\u00d7</button>
        </div>
        <div class="nx-chat-body" id="nx-chat-body"></div>
        <div class="nx-chat-options" id="nx-chat-options"></div>
        <div class="nx-chat-input-row">
          <input type="text" id="nx-chat-input" placeholder="Type a question..." maxlength="500" />
          <button id="nx-chat-send">Ask</button>
        </div>
      </div>
    `;
    document.body.appendChild(wrap);

    const bubble = document.getElementById('nx-chat-bubble');
    const panel = document.getElementById('nx-chat-panel');
    const closeBtn = document.getElementById('nx-chat-close');
    const input = document.getElementById('nx-chat-input');
    const sendBtn = document.getElementById('nx-chat-send');

    bubble.addEventListener('click', function(){
      panel.classList.toggle('open');
      if(panel.classList.contains('open') && chatMessages.length === 0){
        chatAddMsg("Hi! I'm Nexaro Global's AI assistant. Ask me anything about our services, experience, or approach.", 'bot');
        chatRenderSuggestions();
      }
    });
    closeBtn.addEventListener('click', function(){ panel.classList.remove('open'); });

    sendBtn.addEventListener('click', function(){
      const q = input.value.trim();
      if(q) chatAskAI(q);
    });
    input.addEventListener('keydown', function(e){
      if(e.key === 'Enter'){ const q = input.value.trim(); if(q) chatAskAI(q); }
    });
    document.getElementById('nx-chat-options').addEventListener('click', function(e){
      const btn = e.target.closest('[data-chat-suggest]');
      if(!btn) return;
      const idx = parseInt(btn.getAttribute('data-chat-suggest'), 10);
      chatAskAI(CHAT_SUGGESTIONS[idx]);
    });
  }

  mountChatWidget();

  // ============================================================
  // PREMIUM VISUAL LAYER (v4.2 -- Phase 1: vanilla JS, no framework)
  // Scroll-reveal, animated counters, sticky header blur-on-scroll.
  // ============================================================
  function initScrollReveal(){
    const targets = document.querySelectorAll('[data-reveal]');
    if(!('IntersectionObserver' in window)){
      targets.forEach(el => el.classList.add('revealed'));
      return;
    }
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if(entry.isIntersecting){
          entry.target.classList.add('revealed');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.15 });
    targets.forEach(el => observer.observe(el));
  }

  function initCountUp(){
    const raf = window.requestAnimationFrame || function(cb){ return setTimeout(cb, 16); };
    const counters = document.querySelectorAll('[data-count]');
    if(counters.length === 0) return;
    const animate = (el) => {
      const target = parseInt(el.getAttribute('data-count'), 10);
      const suffix = el.getAttribute('data-suffix') || '';
      const duration = 1200;
      const start = (window.performance && performance.now) ? performance.now() : Date.now();
      function step(now){
        const progress = Math.min((now - start) / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 3);
        el.textContent = Math.round(eased * target) + suffix;
        if(progress < 1) raf(step);
      }
      raf(step);
    };
    if(!('IntersectionObserver' in window)){
      counters.forEach(el => { el.textContent = el.getAttribute('data-count') + (el.getAttribute('data-suffix')||''); });
      return;
    }
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if(entry.isIntersecting){
          animate(entry.target);
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.5 });
    counters.forEach(el => observer.observe(el));
  }

  function initNavBlur(){
    const nav = document.querySelector('.nx-nav');
    if(!nav) return;
    window.addEventListener('scroll', function(){
      if(window.scrollY > 20) nav.classList.add('scrolled');
      else nav.classList.remove('scrolled');
    });
  }

  try{ initScrollReveal(); }catch(e){ console.error('Scroll-reveal init failed:', e); }
  try{ initCountUp(); }catch(e){ console.error('Count-up init failed:', e); }
  try{ initNavBlur(); }catch(e){ console.error('Nav blur init failed:', e); }

  // Project submission form -- mailto-based, zero backend, zero data stored.
  // Preserves the site's Zero-Data Contact architecture (see Privacy Policy).
  try{
    const projectForm = document.getElementById('nx-project-form');
    if(projectForm){
      projectForm.addEventListener('submit', function(e){
        e.preventDefault();
        const first = document.getElementById('pf-first').value.trim();
        const last = document.getElementById('pf-last').value.trim();
        const email = document.getElementById('pf-email').value.trim();
        const phone = document.getElementById('pf-phone').value.trim();
        const company = document.getElementById('pf-company').value.trim();
        const website = document.getElementById('pf-website').value.trim();

        const subject = encodeURIComponent('New Project Enquiry \u2014 ' + (company || first + ' ' + last));
        const bodyLines = [
          'Name: ' + first + ' ' + last,
          'Email: ' + email,
          'Phone: ' + (phone || 'Not provided'),
          'Company: ' + (company || 'Not provided'),
          'Website: ' + (website || 'Not provided')
        ];
        const body = encodeURIComponent(bodyLines.join('\\n'));
        window.location.href = 'mailto:lok0781@outlook.com?subject=' + subject + '&body=' + body;
      });
    }
  }catch(e){ console.error('Project form init failed:', e); }
})();

#nexaro-root{
  --navy:#101B33;
  --navy-deep:#0A1226;
  --steel:#8A96A8;
  --steel-light:#C6CCD6;
  --gold:#B8862E;

  color: var(--ink);
  background: var(--ivory);
  border-radius: 12px;
  overflow: hidden;
}
#nexaro-root *{ box-sizing: border-box; }

/* ---- nav ---- */
.nx-nav{ display:flex; align-items:center; justify-content:space-between; padding: 22px 40px; background: var(--ivory); border-bottom: 1px solid #e6e1d6; position: sticky; top:0; z-index: 10; transition: background 0.3s ease, box-shadow 0.3s ease, backdrop-filter 0.3s ease; }
.nx-nav.scrolled{ background: rgba(250,248,243,0.72); backdrop-filter: blur(14px) saturate(160%); -webkit-backdrop-filter: blur(14px) saturate(160%); box-shadow: 0 4px 20px rgba(16,27,51,0.08); }
.nx-brand{ display:flex; align-items:center; gap:12px; }
.nx-mark{ width:52px; height:52px; filter: drop-shadow(0 3px 4px rgba(16,27,51,0.45)) drop-shadow(0 1px 1px rgba(255,255,255,0.15)); transform: perspective(200px) rotateY(-6deg); transition: transform 0.25s ease; }
.nx-brand:hover .nx-mark{ transform: perspective(200px) rotateY(0deg) scale(1.04); }
.nx-brand-text{ font-family: var(--font-display); font-weight:700; font-size:18px; letter-spacing:0.02em; color: var(--navy); line-height:1.1; }
.nx-brand-text span{ display:block; font-family: var(--font-mono); font-size:9px; letter-spacing:0.18em; color: var(--gold); font-weight:500; }
.nx-links{ display:flex; gap:32px; list-style:none; margin:0; padding:0; }
.nx-links button{ background:none; border:none; font-family: var(--font-body); font-size:13.5px; font-weight:600; color: var(--navy); cursor:pointer; }
.nx-cta{ background: var(--navy); color:#fff; border:none; padding:11px 22px; border-radius:2px; font-size:13px; font-weight:600; cursor:pointer; letter-spacing:0.02em; }

/* ---- hero ---- */
.nx-hero{ position:relative; background: var(--navy); color: var(--ivory); padding: 100px 40px 90px; overflow:hidden; }
.nx-hero-mesh{ position:absolute; inset:0; opacity:0.5; }
.nx-hero-inner{ position:relative; max-width: 760px; margin:0 auto; text-align:center; }
.nx-eyebrow{ font-family: var(--font-mono); font-size:11px; letter-spacing:0.28em; text-transform:uppercase; color: var(--gold-light); margin-bottom:22px; }
.nx-hero h1{ font-family: var(--font-display); font-weight:700; font-size:50px; line-height:1.12; margin:0 0 22px; letter-spacing:-0.01em; }
.nx-hero h1 em{ font-style:normal; color: var(--gold-light); }
.nx-hero p{ font-size:16px; line-height:1.65; color: var(--steel-light); max-width:560px; margin: 0 auto 34px; }
.nx-hero-cta{ display:flex; gap:14px; justify-content:center; }
.btn-gold{ background: var(--gold); color: var(--navy-deep); border:none; padding:14px 28px; border-radius:2px; font-weight:700; font-size:13.5px; letter-spacing:0.02em; cursor:pointer; transition: box-shadow 0.25s ease, transform 0.25s ease; }
.btn-gold:hover{ box-shadow: 0 0 22px rgba(212,169,79,0.55), 0 6px 18px rgba(16,27,51,0.25); transform: translateY(-2px); }

<script>
(function(){
  const root = document.getElementById('nexaro-root');

  function markSVG(size){
    return `<svg width="${size}" height="${size}" viewBox="0 0 100 100">
      <polygon points="50,5 90,30 90,70 50,95 10,70 10,30" fill="none" stroke="#B8862E" stroke-width="2"/>
      <polygon points="50,5 90,30 50,50 10,30" fill="#C6CCD6" opacity="0.9"/>
      <polygon points="50,50 90,30 90,70 50,95" fill="#8A96A8" opacity="0.9"/>
      <polygon points="50,50 10,30 10,70 50,95" fill="#101B33" opacity="0.85"/>
      <line x1="50" y1="5" x2="50" y2="50" stroke="#0A1226" stroke-width="1"/>
      <line x1="10" y1="30" x2="50" y2="50" stroke="#0A1226" stroke-width="1"/>
      <line x1="90" y1="30" x2="50" y2="50" stroke="#0A1226" stroke-width="1"/>
    </svg>`;
  }

  function meshSVG(){
    const pts = [[60,40],[180,20],[300,60],[420,15],[540,50],[660,25],
                 [90,140],[230,110],[360,150],[490,120],[610,155],
                 [50,240],[190,220],[330,255],[460,215],[600,245],
                 [110,340],[260,320],[400,350],[540,315]];
    let lines='';
    for(let i=0;i<pts.length;i++){
      for(let j=i+1;j<pts.length;j++){
        const d = Math.hypot(pts[i][0]-pts[j][0], pts[i][1]-pts[j][1]);
        if(d < 150 && Math.random()>0.55){
          lines += `<line x1="${pts[i][0]}" y1="${pts[i][1]}" x2="${pts[j][0]}" y2="${pts[j][1]}" stroke="#B8862E" stroke-width="0.6" opacity="0.35"/>`;
        }
      }
    }
    let dots = pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="2.2" fill="#D4A94F" opacity="0.6"/>`).join('');
    return `<svg viewBox="0 0 680 380" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">${lines}${dots}</svg>`;
  }

  function badgeShell(id, bg, inner){
    return `<svg viewBox="0 0 32 32">
      <defs>
        <linearGradient id="g${id}" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="${bg[0]}"/><stop offset="100%" stop-color="${bg[1]}"/>
        </linearGradient>
        <filter id="s${id}" x="-30%" y="-30%" width="160%" height="160%">
          <feDropShadow dx="0" dy="1.2" stdDeviation="1" flood-color="#000" flood-opacity="0.35"/>
        </filter>
      </defs>
      <rect x="1" y="1" width="30" height="30" rx="7" fill="url(#g${id})" filter="url(#s${id})"/>
      <rect x="1" y="1" width="30" height="14" rx="7" fill="#fff" opacity="0.12"/>
      ${inner}
    </svg>`;
  }

  function linkedinIcon(){
    return badgeShell('li', ['#0A66C2','#004182'],
      `<text x="16" y="22" font-family="Arial,sans-serif" font-weight="700" font-size="15" fill="#fff" text-anchor="middle">in</text>`);
  }

  // ============================================================
  // AI-POWERED CHATBOT WIDGET (Option B)
  // Frontend calls our OWN same-origin serverless endpoint ("/api/chat"),
  // never the Anthropic API directly. The real API key lives only in
  // Vercel's environment variables, inside /api/chat.js -- never here,
  // never in the browser. This keeps the site's CSP clean too: fetch()
  // stays same-origin ('self'), so no CSP change is needed for this.
  // ============================================================
  const chatMessages = [];
  const CHAT_SUGGESTIONS = [
    "What services do you offer?",
    "Tell me about your experience",
    "How does the engagement process work?"
  ];

  function chatAddMsg(text, sender){
    chatMessages.push({ sender, text });
    chatRenderTranscript();
  }

  function chatRenderTranscript(){
    const bodyEl = document.getElementById('nx-chat-body');
    if(!bodyEl) return;
    bodyEl.innerHTML = chatMessages.map(m =>
      `<div class="nx-msg ${m.sender}">${m.text}</div>`
    ).join('');
    bodyEl.scrollTop = bodyEl.scrollHeight;
  }

  function chatRenderSuggestions(){
    const wrap = document.getElementById('nx-chat-options');
    if(!wrap) return;
    wrap.innerHTML = CHAT_SUGGESTIONS.map((q, i) =>
      `<button class="nx-chat-opt" data-chat-suggest="${i}">${q}</button>`
    ).join('');
  }

  async function chatAskAI(question){
    const input = document.getElementById('nx-chat-input');
    const sendBtn = document.getElementById('nx-chat-send');
    const optsWrap = document.getElementById('nx-chat-options');
    optsWrap.innerHTML = '';

    chatAddMsg(question, 'user');
    if(input) input.value = '';
    if(sendBtn) sendBtn.disabled = true;
    chatMessages.push({ sender: 'bot typing', text: 'Thinking...' });
    chatRenderTranscript();

    try{
      const response = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: question })
      });
      const data = await response.json();
      chatMessages.pop(); // remove "Thinking..."
      if(!response.ok){
        chatAddMsg(data.error || "Sorry, something went wrong. Please try again.", 'bot');
      } else {
        chatAddMsg(data.reply, 'bot');
      }
    }catch(err){
      chatMessages.pop();
      chatAddMsg("Sorry, I couldn't reach the assistant just now. Please try again or use the contact details below.", 'bot');
      console.error(err);
    }finally{
      if(sendBtn) sendBtn.disabled = false;
    }
  }

  function initScrollReveal(){
    const targets = document.querySelectorAll('[data-reveal]');
    if(!('IntersectionObserver' in window)){
      targets.forEach(el => el.classList.add('revealed'));
      return;
    }
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if(entry.isIntersecting){
          entry.target.classList.add('revealed');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.15 });
    targets.forEach(el => observer.observe(el));
  }

  function initCountUp(){
    const raf = window.requestAnimationFrame || function(cb){ return setTimeout(cb, 16); };
    const counters = document.querySelectorAll('[data-count]');
    if(counters.length === 0) return;
    const animate = (el) => {
      const target = parseInt(el.getAttribute('data-count'), 10);
      const suffix = el.getAttribute('data-suffix') || '';
      const duration = 1200;
      const start = (window.performance && performance.now) ? performance.now() : Date.now();
      function step(now){
        const progress = Math.min((now - start) / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 3);
        el.textContent = Math.round(eased * target) + suffix;
        if(progress < 1) raf(step);
      }
      raf(step);
    };
    if(!('IntersectionObserver' in window)){
      counters.forEach(el => { el.textContent = el.getAttribute('data-count') + (el.getAttribute('data-suffix')||''); });
      return;
    }
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if(entry.isIntersecting){
          animate(entry.target);
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.5 });
    counters.forEach(el => observer.observe(el));
  }
